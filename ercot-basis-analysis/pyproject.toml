[project]
name = "ercot-basis-analysis"
version = "0.1.0"
description = "ERCOT nodal basis and congestion analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gridstatus",
    "pandas",
    "pyarrow",
    "duckdb",
    "python-dotenv",
    "streamlit",
    "pytest",
]

[tool.uv]
# Scripts-and-notebooks repo, not an installable library: install the
# dependencies but don't try to build this project itself.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# src/ is not an installed package (package = false), so put the repo root
# on sys.path for both pytest and the Makefile entry points.
pythonpath = ["."]
filterwarnings = [
    # pandas 2.3 builds Timedelta(days=...) through a NumPy path that NumPy
    # 2.5 deprecates. Our code passes explicit units; this covers pandas'
    # own internals until a pandas release that does the same.
    "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
