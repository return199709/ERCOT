[project]
name = "grid-disclosure-copilot"
version = "0.1.0"
description = "Cited RAG / agent copilot over SEC filings of Texas power companies"
readme = "README.md"
requires-python = ">=3.11"
# Starting point only: not yet resolved or locked. Airflow runs from its own
# Docker image (pinned there with Airflow's constraints files), not from here.
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "beautifulsoup4",
    "lxml",
    "pandas",
    "pyarrow",
    "duckdb",
    "tiktoken",
    "openai",
    "azure-identity",
    "azure-storage-blob",
    "azure-search-documents",
    "streamlit",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
